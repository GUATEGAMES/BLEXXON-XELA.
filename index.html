<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>BLEXXON XELA · SOCIO INTERNO · JAVIER RAMIREZ</title>
<style>
html,body{margin:0;min-height:100%;background:#030914;color:#f4f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 22% 14%,rgba(48,137,215,.18),transparent 37%),linear-gradient(145deg,#020711,#071527 55%,#03101c)}
#boot .box{width:min(460px,100%);padding:32px;border-radius:24px;background:#071221;border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 75px rgba(0,0,0,.5)}
#boot b{display:block;font-size:24px}#boot span{display:block;margin-top:10px;color:#8ea8bb;font-size:13px;line-height:1.5}
#boot .err{color:#ff8d92}
</style>
</head>
<body>
<div id="boot"><div class="box"><b>BLEXXON XELA</b><span id="bootMsg">Cargando portal seguro…</span></div></div>
<script>
(async()=>{
  const OWNER='GUATEGAMES';
  const REPO='BLEXXON-XELA.';
  const PORTAL_REF='1f4812eab09b0a2366ebbdfd08fb0dcc7d247432';
  const API='https://api.github.com/repos/'+OWNER+'/'+encodeURIComponent(REPO)+'/contents/';
  const msg=document.getElementById('bootMsg');
  function decodeBase64Utf8(b64){
    const bin=atob(String(b64||'').replace(/\s/g,''));
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  async function get(path,ref){
    const r=await fetch(API+encodeURIComponent(path)+'?ref='+encodeURIComponent(ref),{
      headers:{'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
    });
    if(!r.ok)throw new Error(path+' HTTP '+r.status);
    const j=await r.json();
    return decodeBase64Utf8(j.content);
  }
  try{
    const [portal,css,js]=await Promise.all([
      get('index.html',PORTAL_REF),
      get('app.css','main'),
      get('app.js','main')
    ]);
    const parsed=new DOMParser().parseFromString(portal,'text/html');
    parsed.querySelectorAll('script,link[rel="stylesheet"]').forEach(e=>e.remove());
    const style=document.createElement('style');
    style.textContent=css;
    document.head.appendChild(style);
    document.body.innerHTML=parsed.body.innerHTML;
    const code=document.createElement('script');
    code.textContent=js+'\n//# sourceURL=blexxon-app.js';
    document.body.appendChild(code);
  }catch(e){
    console.error(e);
    msg.textContent='No se pudo cargar el portal. Cierre esta pestaña y vuelva a intentar. '+(e&&e.message?e.message:'');
    msg.className='err';
  }
})();
</script>
</body>
</html>
