<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>BLEXXON XELA | Mantenimiento</title>
  <style>
    :root{--bg:#030914;--bg2:#071827;--card:rgba(7,23,37,.82);--line:rgba(255,255,255,.10);--text:#f5f8fc;--muted:#91a9bb;--cyan:#63dfff;--green:#8ff2bc}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030914;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{min-height:100vh;overflow:hidden}
    .page{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 16%,rgba(99,223,255,.13),transparent 34%),radial-gradient(circle at 82% 78%,rgba(143,242,188,.08),transparent 30%),linear-gradient(145deg,var(--bg),var(--bg2) 58%,#04111d)}
    .grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
    .glow{position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(99,223,255,.08);filter:blur(80px);animation:float 7s ease-in-out infinite}
    .card{position:relative;z-index:1;width:min(720px,100%);padding:52px 42px;border:1px solid var(--line);border-radius:30px;background:var(--card);backdrop-filter:blur(18px);box-shadow:0 34px 100px rgba(0,0,0,.46);text-align:center}
    .mark{width:74px;height:74px;margin:0 auto 26px;border-radius:22px;display:grid;place-items:center;border:1px solid rgba(99,223,255,.25);background:linear-gradient(145deg,rgba(99,223,255,.14),rgba(143,242,188,.07));box-shadow:inset 0 0 30px rgba(99,223,255,.06)}
    .mark span{font-size:25px;font-weight:950;letter-spacing:-.05em;color:#dff8ff}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:.20em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
    h1{margin:0;font-size:clamp(36px,7vw,72px);line-height:.98;letter-spacing:-.055em}
    p{max-width:520px;margin:22px auto 0;color:var(--muted);font-size:clamp(15px,2vw,18px);line-height:1.65}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:30px;padding:10px 15px;border-radius:999px;border:1px solid rgba(143,242,188,.20);background:rgba(143,242,188,.055);color:var(--green);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(143,242,188,.45);animation:pulse 2s infinite}
    .foot{margin-top:30px;color:#607a8e;font-size:10px;letter-spacing:.11em;text-transform:uppercase}
    @keyframes pulse{70%{box-shadow:0 0 0 11px rgba(143,242,188,0)}100%{box-shadow:0 0 0 0 rgba(143,242,188,0)}}
    @keyframes float{0%,100%{transform:translate(-22vw,-8vh)}50%{transform:translate(20vw,12vh)}}
    @media(max-width:560px){.card{padding:42px 22px;border-radius:24px}.mark{width:64px;height:64px;border-radius:19px}.foot{margin-top:24px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <main class="page" aria-labelledby="maintenance-title">
    <div class="grid" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <section class="card">
      <div class="mark" aria-hidden="true"><span>BX</span></div>
      <div class="eyebrow">BLEXXON XELA</div>
      <h1 id="maintenance-title">Sitio en mantenimiento</h1>
      <p>Estamos preparando una nueva versión de la plataforma. Todas las secciones anteriores se encuentran temporalmente fuera de servicio.</p>
      <div class="status"><span class="dot"></span>Mantenimiento en curso</div>
      <div class="foot">Acceso temporalmente deshabilitado</div>
    </section>
  </main>
</body>
</html>
