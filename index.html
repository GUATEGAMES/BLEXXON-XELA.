<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="dark">
  <title>BLEXXON XELA | Mantenimiento</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030914;color:#f5f8fc;font-family:Arial,sans-serif}body{min-height:100vh}
    .page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,rgba(99,223,255,.13),transparent 34%),linear-gradient(145deg,#030914,#071827 58%,#04111d)}
    .card{width:min(720px,100%);padding:52px 42px;border:1px solid rgba(255,255,255,.10);border-radius:30px;background:#071725;text-align:center;box-shadow:0 34px 100px rgba(0,0,0,.46)}
    .mark{width:74px;height:74px;margin:0 auto 26px;border-radius:22px;display:grid;place-items:center;border:1px solid rgba(99,223,255,.25);background:#0a2435;font-size:25px;font-weight:900}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:.20em;text-transform:uppercase;color:#63dfff;margin-bottom:14px}
    h1{margin:0;font-size:clamp(36px,7vw,72px);line-height:1}.msg{max-width:520px;margin:22px auto 0;color:#91a9bb;font-size:17px;line-height:1.65}
    .status{display:inline-block;margin-top:30px;padding:10px 15px;border-radius:999px;border:1px solid rgba(143,242,188,.20);color:#8ff2bc;font-size:11px;font-weight:900}.foot{margin-top:30px;color:#607a8e;font-size:10px;letter-spacing:.11em;text-transform:uppercase}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="mark">BX</div>
      <div class="eyebrow">BLEXXON XELA</div>
      <h1>Sitio en mantenimiento</h1>
      <p class="msg">El acceso al sistema se encuentra temporalmente deshabilitado. Las secciones internas, reportes y paneles anteriores no están disponibles desde este sitio.</p>
      <div class="status">Mantenimiento en curso</div>
      <div class="foot">Acceso temporalmente bloqueado</div>
    </section>
  </main>
</body>
</html>
